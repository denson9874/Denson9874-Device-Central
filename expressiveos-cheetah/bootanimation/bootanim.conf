# ExpressiveOS boot animation for cheetah (Pixel 7 Pro). Sourced by apply-bootanim.sh and
# tools/make-bootanim.sh: plain NAME=value lines, nothing else.
#
# bootanimation.zip in this folder is the build input. tools/make-bootanim.sh renders it again
# from the two sources below; after a change to tools/render.py, run it and update
# BOOTANIM_ZIP_SHA256 and BOOTANIM_ZIP_SIZE together. bootanimation_holiday.zip likewise, with
# tools/make-bootanim.sh --holiday and the BOOTANIM_HOLIDAY_ZIP_ pair.

# The zip: 1080x1320 canvas, 30 fps, 3 parts, every entry STORED
BOOTANIM_ZIP_SHA256=ca2efba83ecee34bb336ba735f8d088b18a8dc8903236917178828e8711acd55
BOOTANIM_ZIP_SIZE=29419208
# The holiday copy: the same canvas, parts and motion as RGBA colour masks (desc.txt's
# dynamic_colors line), which the phone colours in from persist.bootanim.color1..4
BOOTANIM_HOLIDAY_ZIP_SHA256=203fbb84e7d3336d01f21b8e248bd7d000f09ed1ea5147c01675fc91b4981ac9
BOOTANIM_HOLIDAY_ZIP_SIZE=15767559

# Sources
# The ExpressiveOS logo, from this repo
BOOTANIM_LOGO=docs/assets/screenshots/logo.png
BOOTANIM_LOGO_SHA256=d41dbcb2c35f756dca919a347c01a2cd5d0ce2cd4bc7ea6a395aa3520e662d64
# Google Sans Flex 3.007 (SIL Open Font License 1.1), the variable font ExpressiveLauncher ships
BOOTANIM_FONT=android/lawnchair/res/font/googlesansflex_variable.ttf
BOOTANIM_FONT_REPO=https://github.com/denson9874/ExpressiveLauncher
BOOTANIM_FONT_SHA256=2510a8b7a24beb1fe8163e9a49813ccfe96b5453444b9443d42665ca4fa320c9
