# ViPER4Android RE for ExpressiveOS on cheetah (Pixel 7 Pro): the exact upstream files
# that ship, and what every script checks them against. Sourced by fetch-v4a.sh,
# apply-v4a.sh and tools/v4a-check.sh: plain NAME=value lines, nothing else.
#
# To move to a new release, change every line of a block together, from the release
# page and the tag, then run fetch-v4a.sh: it refuses anything that doesn't match.
# Check that the new APK asks for no new privileged permission (V4A_APP_PERMS) and that
# the driver still targets the HIDL effect HAL (the non-AIDL zip).

# --- App: likelikeslike/ViPER4Android, the unmodified release APK (GPL-3.0) -------------
V4A_APP_VERSION=2.1.1
V4A_APP_URL=https://github.com/likelikeslike/ViPER4Android/releases/download/2.1.1/ViPER4Android-2.1.1.apk
V4A_APP_FILE=ViPER4Android-2.1.1.apk
V4A_APP_SHA256=b60a8e38c4abf00b5e3f0d4802732bf1dc8679047cc9471fb36bf74a9c572cba
V4A_APP_SIZE=3845789
# SHA-256 of the APK's v2 signing certificate (CN=ViPER4Android, O=LLSL). v2 only, no v1 or v3.
# Releases 1.5.5 to 2.1.1 share it, so GitHub updates install over the built-in copy.
V4A_APP_CERT_SHA256=0edfb18ea10326bded7d15d84b919b0c75a610554b394aa955f345dfdc14c35f
V4A_APP_PACKAGE=com.llsl.viper4android
V4A_APP_SRC=https://github.com/likelikeslike/ViPER4Android
V4A_APP_TAG=2.1.1
V4A_APP_COMMIT=dfcbda7bceb01b7f3a77e092083311181768278c
V4A_APP_LICENSE_URL=https://raw.githubusercontent.com/likelikeslike/ViPER4Android/2.1.1/LICENSE
V4A_APP_LICENSE_FILE=ViPER4Android-2.1.1-LICENSE
V4A_APP_LICENSE_SHA256=3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986
# Every <uses-permission> in the APK's manifest, in manifest order. fetch-v4a.sh refuses an
# APK that asks for anything else. Only MODIFY_AUDIO_ROUTING is privileged
# (signature|privileged|role); tree/privapp-permissions-com.llsl.viper4android.xml grants it.
V4A_APP_PERMS="android.permission.FOREGROUND_SERVICE android.permission.FOREGROUND_SERVICE_SPECIAL_USE android.permission.MODIFY_AUDIO_SETTINGS android.permission.RECEIVE_BOOT_COMPLETED android.permission.POST_NOTIFICATIONS android.permission.MODIFY_AUDIO_ROUTING android.permission.INTERNET android.permission.REQUEST_INSTALL_PACKAGES android.permission.QUERY_ALL_PACKAGES com.llsl.viper4android.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
V4A_PRIVAPP_PERMS="android.permission.MODIFY_AUDIO_ROUTING"
# The manifest's <uses-library required="false"> tags, in order: tree/Android.bp's
# optional_uses_libs must list the same, or the build's uses-library check stops.
V4A_APP_OPTIONAL_USES_LIBS="androidx.window.extensions androidx.window.sidecar"

# --- Driver: likelikeslike/ViPERFX_RE, the non-AIDL module zip (HIDL effect HAL) --------
V4A_FX_VERSION=v2.1.1
V4A_FX_URL=https://github.com/likelikeslike/ViPERFX_RE/releases/download/v2.1.1/ViPER4Android-RE-v2.1.1.zip
V4A_FX_FILE=ViPER4Android-RE-v2.1.1.zip
V4A_FX_ZIP_SHA256=c8f769f9d9f470e47f8278d69615c899d54af3916d10291d853fbd299ee847a2
V4A_FX_ZIP_SIZE=618433
# Only the 64-bit library ships (gs201 builds the audio HAL 64-bit: IGNORE_PREFER32_ON_DEVICE).
V4A_FX_LIB_MEMBER=common/files/libv4a_re_arm64-v8a.so
V4A_FX_LIB_SHA256=79d058309902ec3a7ac96e225cf052aefe950d8a904a7f405e633916284cd31b
V4A_FX_LIB_SIZE=653400
# The zip's LICENSE (GPL-2.0, identical to ViPERFX_RE's module/LICENSE)
V4A_FX_LICENSE_MEMBER=LICENSE
V4A_FX_LICENSE_SHA256=8177f97513213526df2cf6184d8ff986c675afb514d4e68a404010521b880643
# What the driver reports in the app's Driver Status (module.prop versionCode)
V4A_FX_VERSION_CODE=20261009
V4A_FX_SRC=https://github.com/likelikeslike/ViPERFX_RE
V4A_FX_TAG=v2.1.1
V4A_FX_COMMIT=32587b138eb915d6252ccbebd8a86d05af778957
# The DSP compiled into the library: ViPERFX_RE v2.1.1's ViPERDSP submodule
V4A_VIPERDSP_SRC=https://github.com/likelikeslike/ViPERDSP
V4A_VIPERDSP_COMMIT=6fc1f1b8b2123c8cc49f3b3c7c7d5fbbf8a60933
# The effect's implementation uuid (its descriptor's type is EFFECT_UUID_NULL)
V4A_FX_UUID=90380da3-8536-4744-a6a3-5731970e640f
