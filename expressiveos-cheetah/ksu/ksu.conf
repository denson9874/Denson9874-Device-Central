# SukiSU (SukiSU-Ultra) for ExpressiveOS: the release fetch-ksu.sh downloads. Root out of the
# box on every phone with EOS_KSU=lkm (Daryl, 2026-11-14): SukiSU only, no susfs or Zygisk.
# Each SHA-256 is the one the release page lists for that asset,
# https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases/tag/<version>; fetch-ksu.sh refuses
# anything that doesn't match.
version=v4.3.0-r2
# Its version code, which the kernel module and the manager must share (40000 + the tag's
# commit count - 2815; tools/ksu-module.sh builds ours with it)
version_code=41150
release_url=https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases/download/v4.3.0-r2
# Manager APK, installed to /data on a phone's first boot with root (tree/ksu-firstboot.sh):
# the kernel crowns only a manager under /data/app with this package name and signer
manager_file=SukiSU_v4.3.0-r2_41150-release.apk
manager_sha256=6fe64e7bcf9fd768c58f46afea2f27ee9fb85d2783472a7e81334df21e700636
manager_package=com.sukisu.ultra
# SHA-256 of the manager's APK signing certificate: the module trusts only this signer
# (KSU_EXPECTED_HASH in its kernel/Kbuild). fetch-ksu.sh checks the APK has it.
manager_cert_sha256=947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef
# ksuinit: init_boot's /init, which loads /kernelsu.ko and then runs the real init (/init.real)
ksuinit_file=ksuinit-aarch64
ksuinit_sha256=c7034b996c739734ecefe4357397549443725830c3e395ee4e2dd7913a4c2b26
# The release's module for Google's prebuilt android16-6.12 GKI (the Pixel 11s,
# EOS_KERNEL=prebuilt). cheetah and husky build theirs from src_commit against our own kernel
# (tools/ksu-module.sh): a module must match its kernel's struct module.
ko_android16-6.12_file=lkm-aarch64-android16-6.12_kernelsu.ko
ko_android16-6.12_sha256=9f999173fa65b3eb3a90e2becf2bf5ec42a5c5f7d58106802aaa9f8c16f71048
# The release's source (the tag's commit), for our own kernelsu.ko and the GPL source offer
src_url=https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
src_commit=645ef9860b9b7f900bb5d1b27e224f2c311d39c0
