# KernelSU Next for ExpressiveOS on cheetah (Pixel 7 Pro): the release fetch-ksu.sh downloads.
# Copy each SHA-256 from the release page,
# https://github.com/KernelSU-Next/KernelSU-Next/releases/tag/<version>,
# or, when the page lists none, from fetch-ksu.sh's first run after checking the
# file came from that release. fetch-ksu.sh refuses anything that doesn't match.
version=v3.4.2
# Google's GKI that cheetah's boot.img ships (cheetah-ksu.sh checks the build agrees)
kmi=android14-6.1
# Host ksud (x86_64 Linux): patches init_boot on the build server, with
# kernelsu.ko, the susfs guard module and ksuinit for every KMI built in.
ksud_url=https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.2/ksud-x86_64-unknown-linux-musl
# Downloaded 2026-10-25 from the URL above (ksud --version: 3.4.2). TODO before release: compare with the
# release page; fetch-ksu.sh trusts this value
ksud_sha256=4d22f89416e7eef8f684f1ed03d2bea19da33c7d41266546e94fd7d1f6cbeca9
# Manager APK, preinstalled by patches/device_google_pantah/0001. The file name carries
# a build number (e.g. KernelSU_Next_v3.4.2_<code>-release.apk): copy the release's
# plain APK link, not the "spoofed" one.
manager_url=https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.2/KernelSU_Next_v3.4.2_33355-release.apk
manager_sha256=774a5511f7034a4930e881114e202319cbdc34c5aaaa5c7c6b6d2902364e4c58
# SHA-256 of the manager's APK signing certificate: KernelSU Next's kernel module only
# trusts this signer (KSU_NEXT_MANAGER_HASH in its kernel/Kbuild). fetch-ksu.sh checks it.
manager_cert_sha256=79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7
# Source of ExpressiveOS's own kernelsu.ko (tools/ksu-module.sh builds it with
# kernel-patches/): the commit the release tag names. fetch-ksu.sh checks the tag
# still points at it.
src_url=https://github.com/KernelSU-Next/KernelSU-Next.git
src_commit=4c706b5938665866ebe16944a481a7b91e3396af
# Zygisk provider, preinstalled (Daryl, 2026-10-27): NeoZygisk by JingMatrix, GPL-3.0, shipped
# unmodified as /product/etc/eos/zygisk-provider.zip; tree/ksu-firstboot.sh installs it once on
# a new phone's first boot. The release page,
# https://github.com/JingMatrix/NeoZygisk/releases/tag/v2.4, lists the same sha256. Its 'c'
# hook matches cnb's Zygote.nativeForkAndSpecialize; check that again before moving this pin
# or KernelSU Next's, and after a tree sync that changes Zygote.java.
zygisk_version=v2.4
zygisk_version_code=289
zygisk_module_id=zygisksu
zygisk_url=https://github.com/JingMatrix/NeoZygisk/releases/download/v2.4/NeoZygisk-v2.4-289-release.zip
zygisk_sha256=93a1425c67bb89f58a0dcb9fc823ec93f6472214f221e667a70b67c6a6e061a1
# Its source, for the GPL source offer: the tag's commit, with the LSPlt submodule (LGPL-3.0)
zygisk_src_url=https://github.com/JingMatrix/NeoZygisk.git
zygisk_src_commit=08080ef775c7fbbd1ad5c4a5d837f81933437abd
zygisk_lsplt_commit=3e29437f037cb7d2b9fbb459dcf162f6b8d1d926
