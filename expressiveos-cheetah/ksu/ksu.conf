# Root for ExpressiveOS: Wild Kernels' GKI with BakaSU and susfs built in (Daryl, 2026-11-14),
# on every phone with EOS_KSU=wild. The kit takes the kernel Image out of Wild's AnyKernel3 zip
# for the phone's KMI and builds boot.img around it (tools/wild-boot.sh); the tree signs it like
# any prebuilt boot. No manager ships: users install the BakaSU APK they want (release or
# nightly, links below; the release notes give both). Each SHA-256 is the one GitHub lists for
# the asset on the release page; fetch-ksu.sh refuses anything that doesn't match.
version=r23
release_url=https://github.com/WildKernels/GKI_KernelSU_SUSFS/releases/download/r23
# One zip per KMI. cheetah and husky: the 6.1.162 March 2026 GKI (matches stock android14-6.1
# vendor modules). The Pixel 11s: 6.12.92 (2026-09), proven on kodiak; 6.12.96-lts boot-looped
# system_server there (2026-11-14). Kept in sync with pins/wild-kernel.conf.
zip_android14-6.1=6.1.172-android14-2026-06-BakaSU-AnyKernel3.zip
zip_android14-6.1_sha256=b9e6310be8790c9fe44898f5e12b895de8670cb50d68352f1d35c05a27ce5257
uname_android14-6.1=6.1.172-android14-Wild
zip_android16-6.12=6.12.92-android16-2026-09-BakaSU-AnyKernel3.zip
zip_android16-6.12_sha256=ed1aad072afdc99c4e163795faa8ab5104b4a594a4a9bbde9f886ab9dbce5a82
uname_android16-6.12=6.12.92-android16-Wild
# BakaSU's kernel version code in these kernels (ksud debug version)
bakasu_version_code=34562
# Where users get the manager (release notes, README)
manager_release_url=https://github.com/Baka-SU/BakaSU/releases
manager_nightly_url=https://github.com/Baka-SU/BakaSU/actions
# Wild's source, for the GPL source offer
src_url=https://github.com/WildKernels/GKI_KernelSU_SUSFS
