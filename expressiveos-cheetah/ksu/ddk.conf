# The kernel module DDK ExpressiveOS builds its own kernelsu.ko with on a phone whose kernel is
# Google's prebuilt GKI (EOS_KERNEL=prebuilt: the Pixel 11s), whose tree holds no kernel source:
# the image KernelSU Next's CI builds its own modules in (its .github/workflows/ddk-lkm-ksu.yml:
# ghcr.io/ylarod/ddk-min:<kmi>-<ddk_release>; v3.4.2's ddk_release is 20260828). One block per
# KMI, <kmi>_<name>=value. tools/ksu-ddk.sh fetches the image by its digest, checks the
# manifest and every layer against it, and unpacks its /opt/ddk: the kernel tree prepared with
# gki_defconfig and modules_prepare (kdir/<kmi>), its source (src/<kmi>), Google's clang and
# rust. Moving a pin: copy the digest the registry gives for the new tag (devices-check.sh gki
# prints it), then build a kernel-only run and compare the module with the one ksud carries.
android16-6.12_image=ghcr.io/ylarod/ddk-min
