# Pixel 8 Pro (zuma): LineageOS's shusky, zuma and husky trees with TheMuppets' blobs, the
# same gs-6.1 kernel source and GKI as cheetah (one boot.img for both), so the same
# KernelSU Next module. Its audio effects run on the AIDL effect HAL: no ViPER4Android.
EOS_LUNCH=lineage_husky-cp2a-user
EOS_MODEL=Pixel 8 Pro
EOS_BOARD=husky
EOS_RELEASES=releases/expressiveos-husky
EOS_SF_DIR=/home/frs/project/denson9874-s-user-builds/expressiveos/husky
EOS_R2_PREFIX=expressiveos/husky/
EOS_DEVICE_TREE=device/google/shusky
EOS_BOARDCONFIG=device/google/shusky/husky/BoardConfig.mk
EOS_VENDOR_DIR=vendor/google/husky
EOS_RADIO_MK=vendor/google/husky/Android.mk
EOS_FIRMWARE=abl bl1 bl2 bl31 gcf gsa gsa_bl1 ldfw modem pbl tzsw
EOS_FIRMWARE_MODE=blobs
EOS_LFS_PROJECTS=vendor/google/husky vendor/gms
EOS_UPDATER_OVERLAY=UpdaterOverlayHusky
EOS_SENTINEL=device/google/shusky/device-husky.mk
EOS_KERNEL=gs-6.1
EOS_KMI=android14-6.1
EOS_KSU=lkm
EOS_V4A=0
EOS_SUPER_EMPTY=out
EOS_FLASH_VKB=0
EOS_SCONE_PATCH=devices/husky/patches/device_google_shusky/0004-husky-install-SCONE-and-Tycho-as-stock-does.patch
EOS_SYSUI_ODEX=1
