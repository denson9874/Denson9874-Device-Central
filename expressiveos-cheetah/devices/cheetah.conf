# Pixel 7 Pro (gs201): EOS 2.0 pure-AOSP tree with stock prebuilt kernel images + Wild GKI boot
EOS_LUNCH=eos_cheetah-cp2a-user
EOS_MODEL=Pixel 7 Pro
EOS_BOARD=cheetah
EOS_RELEASES=releases/expressiveos-cheetah
EOS_SF_DIR=/home/frs/project/denson9874-s-user-builds/expressiveos/cheetah
EOS_R2_PREFIX=expressiveos/cheetah/
EOS_DEVICE_TREE=device/google/pantah
EOS_BOARDCONFIG=device/google/pantah/cheetah/BoardConfig.mk
EOS_VENDOR_DIR=vendor/google/cheetah
EOS_RADIO_MK=vendor/google/cheetah/Android.mk
EOS_FIRMWARE=abl bl1 bl2 bl31 gsa ldfw modem pbl tzsw
EOS_FIRMWARE_MODE=cache
EOS_LFS_PROJECTS=vendor/google/cheetah vendor/gms
EOS_UPDATER_OVERLAY=UpdaterOverlayCheetah
EOS_SENTINEL=device/google/pantah/eos_cheetah.mk
EOS_KERNEL=prebuilt
EOS_KMI=android14-6.1
# Rooted out of the box with Wild Kernels' BakaSU kernel, susfs built in (pins/wild-kernel.conf):
# wild ships boot.img with Wild's kernel and no manager (ksu/README.md); none the stock boot.
EOS_KSU=wild
EOS_V4A=1
EOS_SUPER_EMPTY=out
EOS_FLASH_VKB=1
EOS_SCONE_PATCH=patches/device_google_pantah/0004-cheetah-install-SCONE-and-Tycho-as-stock-does.patch
EOS_SYSUI_ODEX=1
