# Pixel 11 Pro (Tensor G6): Daryl's grizzly tree, Google's stock vendor, vendor_dlkm, system_dlkm,
# dtbo and GKI boot images (vendor/google/grizzly-images, made on the build server from the
# factory image). KernelSU Next's kernelsu.ko builds against its DDK (ksu/ddk.conf), as the kernel
# has no source in the tree; no ViPER4Android (no HIDL effect HAL in a stock vendor).
EOS_LUNCH=lineage_grizzly-cp2a-user
EOS_MODEL=Pixel 11 Pro
EOS_BOARD=grizzly
EOS_RELEASES=releases/expressiveos-grizzly
EOS_SF_DIR=/home/frs/project/denson9874-s-user-builds/expressiveos/grizzly
EOS_R2_PREFIX=expressiveos/grizzly/
EOS_DEVICE_TREE=device/google/grizzly
EOS_BOARDCONFIG=device/google/grizzly/BoardConfig.mk
EOS_VENDOR_DIR=vendor/google/grizzly
EOS_RADIO_MK=vendor/google/grizzly-images/Android.mk
EOS_FIRMWARE=abl bl31 cap cpm dbc dbl dram_init_0 dram_init_1 dram_init_2 dram_init_3 dram_init_4 dram_init_5 dram_init_6 dram_init_7 dram_init_8 dram_init_9 dram_init_10 dram_init_11 dram_phy gc gdmc gsa_bl1 gsa_fw modem tzsw
EOS_FIRMWARE_MODE=images
EOS_LFS_PROJECTS=vendor/gms
EOS_UPDATER_OVERLAY=UpdaterOverlayGrizzly
EOS_SENTINEL=device/google/grizzly/lineage_grizzly.mk
EOS_KERNEL=prebuilt
EOS_KMI=android16-6.12
EOS_KSU=lkm
EOS_V4A=0
EOS_SUPER_EMPTY=factory
EOS_FLASH_VKB=1
EOS_SYSUI_ODEX=0
