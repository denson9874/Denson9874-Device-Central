<!doctype html>
<!-- The live build page: reads status.txt beside it (what tools/eos-progress-publish.sh sends
     from the build server once a minute, eos-progress.py's output under a PUBLISHED line) and
     shows it. Nothing here is loaded from anywhere else. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#141329">
<title>ExpressiveOS builds</title>
<style>
/* Bento Bloom (Daryl's pick, 2026-11-11): the Bloom petal colours of branding/README.md on the
   logo's ground. Violet = building, green = done, blue = queued, coral = failed. */
:root { --ground: #141329; --ink: #f1eefc; --dim: #a9a4c4; --term: #0c0b1a;
  --v-tile: #2A1D47; --v-ink: #C9A6FD; --v-mid: #AE69FC; --v-track: #3a2b5e;
  --g-tile: #10322A; --g-ink: #7FE0B7; --g-mid: #4AD29D;
  --b-tile: #142553; --b-ink: #8FB2FD;
  --c-tile: #3D1A24; --c-ink: #FFA39D; --c-mid: #FD7771;
  --n-tile: #201f36; }
* { box-sizing: border-box; }
html { background: var(--ground); color-scheme: dark; }
body { margin: 0; background: var(--ground); color: var(--ink);
       font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
.head { display: flex; align-items: center; gap: 10px; }
h1 { font-size: 1.3rem; margin: 0; }
#live { margin-left: auto; font-size: .75rem; font-weight: 700; color: var(--g-ink); display: flex; align-items: center; gap: 7px; }
#live i { width: 8px; height: 8px; border-radius: 50%; background: var(--g-mid); box-shadow: 0 0 0 4px #4ad29d33; animation: pulse 2s infinite; }
#live[hidden] { display: none; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px #4ad29d14; } }
@media (prefers-reduced-motion: reduce) { #live i { animation: none; } }
#session, #fresh { color: var(--dim); font-size: .85rem; }
#session { margin-top: 4px; }
#fresh { min-height: 1.3em; margin-bottom: 14px; }
#fresh.bad { color: var(--c-ink); font-weight: 600; background: var(--c-tile); border-radius: 14px; padding: 10px 12px; margin-top: 8px; }
.hero { background: var(--v-tile); border-radius: 26px; padding: 18px; margin-bottom: 10px; }
.hero.failed { background: var(--c-tile); }
.hero .row { display: flex; gap: 16px; align-items: center; }
.hero svg { flex: none; }
.hero .step { color: var(--v-ink); font-weight: 700; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
.hero.failed .step { color: var(--c-ink); }
.hero h2 { font-size: 1.2rem; margin: 0; }
.hero .sub { font-size: .78rem; color: var(--dim); }
.hero .eta { margin-top: 8px; font-size: .82rem; color: #d9cdf5; }
.hero .eta b { display: block; font-size: 1.35rem; color: #fff; }
.steps { display: flex; gap: 5px; margin-top: 14px; }
.steps i { flex: 1; height: 6px; border-radius: 9px; background: var(--v-track); overflow: hidden; }
.steps i.d { background: var(--v-mid); }
.steps i.n b { display: block; height: 100%; background: var(--v-mid); border-radius: 9px; }
.hero.failed .steps i { background: #5a2733; } .hero.failed .steps i.d, .hero.failed .steps i.n b { background: var(--c-mid); }
.steplbl { display: flex; gap: 5px; font-size: .66rem; color: var(--dim); margin-top: 5px; }
.steplbl span { flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steplbl .n { color: var(--v-ink); font-weight: 700; } .hero.failed .steplbl .n { color: var(--c-ink); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { border-radius: 22px; padding: 14px; min-height: 98px; display: flex; flex-direction: column; }
.tile:only-child { grid-column: span 2; min-height: 0; }
.tile b { font-size: .95rem; color: #fff; }
.tile small { font-size: .75rem; opacity: .9; }
.tile .st { margin-top: auto; padding-top: 12px; font-weight: 700; font-size: .82rem; }
.tile.done { background: var(--g-tile); color: var(--g-ink); }
.tile.queued { background: var(--b-tile); color: var(--b-ink); }
.tile.skipped { background: var(--n-tile); color: var(--dim); }
#logwrap { margin-top: 10px; background: var(--term); border-radius: 22px; padding: 14px; }
#logtitle { font-size: .8rem; font-weight: 700; margin: 0 0 8px; }
pre { margin: 0; color: #bdb7dc; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap; overflow-wrap: anywhere; max-height: 50vh; overflow-y: auto; }
details { margin-top: 16px; color: var(--dim); font-size: .85rem; }
details p { white-space: pre-wrap; }
.empty { background: var(--n-tile); border-radius: 22px; padding: 18px; color: var(--dim); }
</style>
</head>
<body>
<main>
  <div class="head"><h1>ExpressiveOS builds</h1><span id="live" hidden><i></i>LIVE</span></div>
  <div id="session"></div>
  <div id="fresh">Loading…</div>
  <div id="phones"></div>
  <div id="logwrap" hidden>
    <h2 id="logtitle">Server log</h2>
    <pre id="log"></pre>
  </div>
  <details id="wordswrap" hidden><summary>In words</summary><p id="words"></p></details>
</main>
<script>
"use strict";
const MODELS = { cheetah: "Pixel 7 Pro", husky: "Pixel 8 Pro", kodiak: "Pixel 11 Pro XL",
                 grizzly: "Pixel 11 Pro", yogi: "Pixel 11 Pro Fold", cubs: "Pixel 11" };
const STEPS = { wait: "waiting", prepare: "preparing the tree", kernel: "kernel", make: "compiling",
                target_files: "target files", ota_zip: "OTA package", verify: "verifying", pack: "packing",
                ota: "uploading the OTA", web: "web installer", done: "done" };
const KINDS = { full: "full build", quick: "quick build", kernel: "kernel only", modules: "modules",
                testers: "testers pack", release: "release pack", upload: "upload", publish: "release" };
const STATES = { queued: "Queued", running: "Running", done: "Done", failed: "Failed", skipped: "Skipped" };
const SESSIONS = { "eos-build": "Build session", "eos-pack": "Pack session" };
const $ = (id) => document.getElementById(id);
const eastern = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit", timeZoneName: "short" });
const easternDay = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", month: "short", day: "numeric" });
let published = null, every = 60, running = false;

function fields(rest) {
  const o = {};
  for (const w of rest.split(" ")) { const i = w.indexOf("="); if (i > 0) o[w.slice(0, i)] = w.slice(i + 1); }
  return o;
}
// parse(text): what status.txt says. Exported for the kit's test (window.eosParse).
function parse(text) {
  const out = { published: null, every: 60, session: null, phones: [], log: [], logPhone: "", words: "", ok: false, error: "" };
  const lines = text.split("\n");
  let i = 0;
  for (; i < lines.length; i++) {
    const l = lines[i];
    if (l.startsWith("PUBLISHED ")) {
      const f = fields(l.slice(10));
      out.published = Date.parse(f.at) || null;
      out.every = Number(f.every) || 60;
    } else if (l.startsWith("PROGRESS ")) out.phones.push(fields(l.slice(9)));
    else if (l.startsWith("SESSION ")) out.session = fields(l.slice(8));
    else if (l.startsWith("LOG device=")) {
      const r = l.slice(11), s = r.indexOf(" ");
      out.logPhone = s < 0 ? r : r.slice(0, s);
      out.log.push(s < 0 ? "" : r.slice(s + 1));
    } else if (l.startsWith("PUBLISH_ERROR ")) out.error = l.slice(14);
    else if (l === "PROGRESS_OK") { out.ok = true; i++; break; }
  }
  out.words = lines.slice(i).join("\n").trim();
  return out;
}
window.eosParse = parse;

function span(s) {
  s = Math.max(0, Math.round(s));
  if (s < 60) return "under a minute";
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? h + " h " + m + " min" : m + " min";
}
function when(ms) {
  const d = new Date(ms);
  const t = eastern.format(d);
  return easternDay.format(d) === easternDay.format(new Date()) ? t : easternDay.format(d) + ", " + t;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
const SVG = "http://www.w3.org/2000/svg";
function svg(tag, attrs) {
  const e = document.createElementNS(SVG, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
// ring(pct, colour, track): the hero's ring; pct null = a step with no count, an empty ring
function ring(pct, colour, track, label) {
  const R = 44, C = 2 * Math.PI * R;
  const s = svg("svg", { width: 104, height: 104, viewBox: "0 0 104 104", role: "img", "aria-label": label });
  s.append(svg("circle", { cx: 52, cy: 52, r: R, fill: "none", stroke: track, "stroke-width": 11 }));
  if (pct !== null && pct > 0) s.append(svg("circle", { cx: 52, cy: 52, r: R, fill: "none", stroke: colour, "stroke-width": 11,
    "stroke-linecap": "round", "stroke-dasharray": (C * pct / 100).toFixed(1) + " " + C.toFixed(1), transform: "rotate(-90 52 52)" }));
  const t = svg("text", { x: 52, y: pct === null ? 58 : 60, "text-anchor": "middle", "font-size": pct === null ? 17 : 25,
    "font-weight": 800, fill: "#fff", "font-family": "system-ui, sans-serif" });
  t.textContent = label;
  s.append(t);
  return s;
}
// The steps a session of that kind goes through, for the hero's step bar
const BUILD_STEPS = ["prepare", "kernel", "make", "target_files", "ota_zip", "verify", "pack"];
const RELEASE_STEPS = ["pack", "ota", "web"];
const SHORT = { prepare: "prepare", kernel: "kernel", make: "compile", target_files: "target", ota_zip: "OTA zip",
                verify: "verify", pack: "pack", ota: "OTA", web: "web" };
function hero(p, failed) {
  const h = el("div", "hero" + (failed ? " failed" : ""));
  const done = Number(p.done), total = Number(p.total);
  const pct = p.step === "make" && total > 0 ? Math.min(100, Math.floor(100 * done / total)) : null;
  const row = el("div", "row");
  row.append(failed ? ring(null, "", "#5a2733", "✕")
    : ring(pct, "#AE69FC", "#3a2b5e", pct === null ? "…" : pct + "%"));
  const t = el("div");
  t.append(el("div", "step", failed ? "Failed at " + (STEPS[p.step] || p.step) : (STEPS[p.step] || p.step)));
  t.append(el("h2", "", MODELS[p.device] || p.device));
  t.append(el("div", "sub", p.device + (KINDS[p.kind] ? " · " + KINDS[p.kind] : "") + (p.fresh === "1" ? " · from scratch" : "")
    + (pct !== null ? " · " + done.toLocaleString("en-US") + " of " + total.toLocaleString("en-US") : "")));
  const eta = Date.parse(p.eta), e = el("div", "eta");
  if (failed) e.textContent = Number(p.elapsed_s) > 0 ? "After " + span(Number(p.elapsed_s)) + ". The log below says why." : "The log below says why.";
  else if (eta) {
    e.append("Done around", el("b", "", when(eta)));
    if (published) e.append("about " + span((eta - published) / 1000) + " left");
  } else if (Number(p.elapsed_s) > 0) e.textContent = "Running for " + span(Number(p.elapsed_s));
  if (!failed && Number(p.failed) > 0) e.append(" · " + p.failed + " failed actions");
  t.append(e);
  row.append(t);
  h.append(row);
  const list = p.kind === "publish" ? RELEASE_STEPS : BUILD_STEPS, at = list.indexOf(p.step);
  if (at >= 0) {
    const bar = el("div", "steps"), lbl = el("div", "steplbl");
    list.forEach((name, i) => {
      const seg = el("i", i < at ? "d" : i === at ? "n" : "");
      if (i === at) { const f = el("b"); f.style.width = (pct === null ? (failed ? 100 : 50) : Math.max(pct, 4)) + "%"; seg.append(f); }
      bar.append(seg);
      lbl.append(el("span", i === at ? "n" : "", SHORT[name]));
    });
    h.append(bar, lbl);
  }
  return h;
}
function tile(p, state) {
  const t = el("div", "tile " + state);
  t.append(el("b", "", MODELS[p.device] || p.device), el("small", "", p.device + (KINDS[p.kind] ? " · " + KINDS[p.kind] : "")));
  const eta = Date.parse(p.eta);
  t.append(el("div", "st", state === "done" ? "✓ Done" + (Number(p.elapsed_s) > 0 ? " · " + span(Number(p.elapsed_s)) : "")
    : state === "queued" ? "Queued" + (eta ? " · " + when(eta) : "")
    : "Skipped"));
  return t;
}

function render(s) {
  published = s.published; every = s.every;
  const ses = s.session;
  running = !!ses && ses.state === "running";
  $("live").hidden = !running;
  const box = $("phones");
  box.replaceChildren();
  if (s.error) $("session").textContent = "The server could not read its build state (" + s.error + ").";
  else if (!ses || ses.state === "none") { $("session").textContent = ""; box.append(el("div", "empty", "No build is running, and none has run yet.")); }
  else {
    const name = SESSIONS[ses.name] || ses.name;
    const start = Date.parse(ses.started);
    $("session").textContent = name + (ses.state === "running" ? " running" : ses.state === "done" ? " finished" : " failed")
      + (start ? " · started " + when(start) : "") + (ses.state === "failed" && ses.exit !== "-" ? " · exit " + ses.exit : "");
  }
  // The phones building or failed get the big tiles, the rest the grid, in build order
  let grid = null;
  for (const p of s.phones) {
    const state = STATES[p.state] ? p.state : "queued";
    if (state === "running" || state === "failed") { box.append(hero(p, state === "failed")); grid = null; continue; }
    if (!grid) { grid = el("div", "grid"); grid.style.marginBottom = "10px"; box.append(grid); }
    grid.append(tile(p, state));
  }
  $("logwrap").hidden = !s.log.length;
  if (s.log.length) {
    $("logtitle").textContent = "Server log" + (s.logPhone ? " · " + s.logPhone + (s.log.length > 1 ? " · last " + s.log.length + " lines" : "") : "");
    const pre = $("log");
    const atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30 || !pre.textContent;
    pre.textContent = s.log.join("\n");
    if (atEnd) pre.scrollTop = pre.scrollHeight;
  }
  $("wordswrap").hidden = !s.words;
  $("words").textContent = s.words;
  document.title = (s.phones.some((p) => p.state === "failed") || (ses && ses.state === "failed") ? "Failed · " : running ? "Building · " : "") + "ExpressiveOS builds";
  tick();
}
// The age of what's shown. A running session sends every minute: if that stops, say so,
// so an old "running" is never read as news.
function tick() {
  const f = $("fresh");
  if (!published) return;
  const age = (Date.now() - published) / 1000;
  const stale = running && age > 3 * every + 30;
  f.className = stale ? "bad" : "";
  f.textContent = stale
    ? "The server stopped reporting " + span(age) + " ago (last report " + when(published) + "). What's below may be out of date."
    : running ? "Updated " + (age < 90 ? Math.max(0, Math.round(age)) + " s" : span(age)) + " ago"
    : "Last report " + when(published) + ". Refreshes by itself when a build starts.";
}
async function load() {
  try {
    const r = await fetch("status.txt?t=" + Date.now(), { cache: "no-store" });
    if (r.status === 404) { $("fresh").textContent = "No build has reported here yet."; return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(parse(await r.text()));
  } catch (e) {
    if (!published) { $("fresh").className = "bad"; $("fresh").textContent = "Can't read the build status (" + e.message + "). Trying again."; }
  }
}
load();
setInterval(load, 30000);
setInterval(tick, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
