# Expressive Launcher for ExpressiveOS: the exact release APK that ships as every phone's
# Home and Recents app, and what every script checks it against. Sourced by
# fetch-launcher.sh, apply-launcher.sh and tools/launcher-check.sh: plain NAME=value lines,
# nothing else.
#
# To move to a new release, change every line of the block together, from the release page
# and the update feed (https://raw.githubusercontent.com/denson9874/ExpressiveLauncher/updates/
# qa-v2/latest.json for QA, .../updates/release/latest.json for Stable), then run
# fetch-launcher.sh: it refuses anything that doesn't match. A new privileged permission
# (EL_PERMS) must be added to tree/privapp-permissions-dev.launcher.expressive.l3.xml on
# purpose, or a clean flash won't boot under ro.control_privapp_permissions=enforce (README.md,
# "Pins").

# --- Expressive Launcher (denson9874/ExpressiveLauncher), the unmodified release APK ------
# Daryl, 2026-10-30: the latest QA build (Stable is 5.0.0, versionCode 62). The full QA build,
# not "Core": Core leaves out the notification listener (dots) and accessibility service.
# 5.0.8 is the first published release that runs as Android 17's Recents app with Overview
# previews (README.md, "Status"): 5.0.5 crashed on the 7 Pro, 5.0.6 left Overview cards blank,
# and 5.0.7 (never published) crashed on Overview's Share and Lens. 5.0.9 (Daryl, 2026-11-01)
# adds Pro included on ExpressiveOS (platform-certificate check) and work badges in the app
# pickers. 5.1.1 (2026-11-05) is the first release whose Home activity has priority 1
# (ExpressiveLauncher#49), so it stays the default Home next to Pixel Launcher, and has the
# drawer blur, Smartspacer clipping, 3-button order and small-folder rename fixes; same
# permissions, optional libraries and licence files as 5.0.8. 5.1.3 (2026-11-08, for
# ExpressiveOS 1.1.2, Daryl's card "EL 5.1.3 tonight, this fix only") adds one permission,
# ACCESS_CONTEXTUAL_SEARCH (signature|privileged), so holding the navigation handle opens
# Circle to Search with Expressive Launcher; it is in the privapp XML too. Same optional
# libraries and licence files.
EL_CHANNEL=qa
EL_VERSION=5.2.2
EL_VERSION_CODE=85
EL_TAG=qa-v5.2.2-85
EL_URL=https://github.com/denson9874/ExpressiveLauncher/releases/download/qa-v5.2.2-85/ExpressiveLauncherL3.5.2.2.expressive.release.apk
EL_FILE=ExpressiveLauncherL3.5.2.2.expressive.release.apk
EL_SHA256=12932b471b2b5b06c413da3679b1d148ab662f828e6a80a4f04cc70cd1d4b801
EL_SIZE=24561725
# SHA-256 of the APK's signing certificate (its v3 signer): Expressive's release
# certificate, the same for Stable and QA, so GitHub and in-app updates install over the
# built-in copy.
EL_CERT_SHA256=2aa9f1bf3dbd2d5bd27ad7516f1caf1b8a18e15f6d59858a37282784bb2acba7
EL_PACKAGE=dev.launcher.expressive.l3
EL_SRC=https://github.com/denson9874/ExpressiveLauncher
# The source revision the release names ("Source revision" on the release page)
EL_COMMIT=51d707849ab9472c5f11201175d3c0f19ea4a848
# Apache-2.0 (AOSP Launcher3 and Lawnchair), the LICENSE.txt at that revision
EL_LICENSE_URL=https://raw.githubusercontent.com/denson9874/ExpressiveLauncher/51d707849ab9472c5f11201175d3c0f19ea4a848/LICENSE.txt
EL_LICENSE_FILE=ExpressiveLauncher-51d7078-LICENSE.txt
EL_LICENSE_SHA256=4bb3ad323fe4c27f06a47b39c0ae6ad35315f15c40e46c81a5211f7f519286ab
# The licences of what it carries beside that (docs/THIRD_PARTY_NOTICES.md at that revision),
# staged next to LICENSE: the calculator's MIT licence, from the source at that revision, and
# Google Sans Flex's OFL-1.1 from the font's own repository at the revision that file names.
EL_NOTICE_MIT_URL=https://raw.githubusercontent.com/denson9874/ExpressiveLauncher/51d707849ab9472c5f11201175d3c0f19ea4a848/lawnchair/src/app/lawnchair/search/algorithms/data/calculator/LICENSE
EL_NOTICE_MIT_FILE=ExpressiveLauncher-51d7078-calculator-LICENSE.txt
EL_NOTICE_MIT_SHA256=6f1b3f6fecde974467f78fec9fdad2614c1652ec2bda13206b83c2f9f083a0c9
EL_NOTICE_OFL_URL=https://raw.githubusercontent.com/googlefonts/googlesans-flex/6cffd50d9ff4ead23eda9dc7864eb9aed9fe304c/OFL.txt
EL_NOTICE_OFL_FILE=GoogleSansFlex-6cffd50-OFL.txt
EL_NOTICE_OFL_SHA256=831b6e041705873c3e6efb18c4c96202bc41c8be42a456d3d26c47abf14816d0
# Every <uses-permission> in the APK's manifest, in manifest order. fetch-launcher.sh refuses
# an APK that asks for anything else.
EL_PERMS="dev.launcher.expressive.feed.permission.CONNECT android.permission.REQUEST_INSTALL_PACKAGES android.permission.POST_NOTIFICATIONS android.permission.RECEIVE_BOOT_COMPLETED android.permission.ACCESS_NETWORK_STATE android.permission.MANAGE_EXTERNAL_STORAGE android.permission.INTERNET android.permission.ACCESS_COARSE_LOCATION android.permission.PACKAGE_USAGE_STATS android.permission.USE_BIOMETRIC android.permission.FOREGROUND_SERVICE android.permission.FOREGROUND_SERVICE_DATA_SYNC com.google.android.apps.nexuslauncher.permission.QSB com.kieronquinn.app.smartspacer.permission.ACCESS_SMARTSPACER android.permission.READ_CONTACTS android.permission.READ_MEDIA_AUDIO android.permission.STATUS_BAR_SERVICE android.permission.FLASHLIGHT android.permission.BROADCAST_CLOSE_SYSTEM_DIALOGS android.permission.CONTROL_REMOTE_APP_TRANSITION_ANIMATIONS android.permission.VIBRATE android.permission.QUERY_ALL_PACKAGES android.permission.START_TASKS_FROM_RECENTS android.permission.REMOVE_TASKS android.permission.WRITE_SECURE_SETTINGS android.permission.MANAGE_ACTIVITY_TASKS android.permission.INTERNAL_SYSTEM_WINDOW android.permission.STATUS_BAR android.permission.STOP_APP_SWITCHES android.permission.SET_ORIENTATION android.permission.READ_FRAME_BUFFER android.permission.MANAGE_ACCESSIBILITY android.permission.MONITOR_INPUT android.permission.ALLOW_SLIPPERY_TOUCHES android.permission.ACCESS_SHORTCUTS android.permission.SYSTEM_APPLICATION_OVERLAY android.permission.ACCESS_HIDDEN_PROFILES_FULL android.permission.ACCESS_HIDDEN_PROFILES android.permission.MANAGE_KEY_GESTURES android.permission.ACCESS_CONTEXTUAL_SEARCH android.permission.CALL_PHONE android.permission.SET_WALLPAPER android.permission.SET_WALLPAPER_HINTS android.permission.REQUEST_DELETE_PACKAGES android.permission.EXPAND_STATUS_BAR dev.launcher.expressive.l3.permission.READ_SETTINGS dev.launcher.expressive.l3.permission.WRITE_SETTINGS dev.launcher.expressive.l3.permission.GRID_CONTROL dev.launcher.expressive.l3.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
# The ones whose protectionLevel (frameworks/base core/res/AndroidManifest.xml) includes
# "privileged": each needs a line in the privapp XML, or a privileged system app fails the
# boot under ro.control_privapp_permissions=enforce (the build sets "log" today, which only
# logs it, but the list is kept exact either way). The others it gets as the Recents app
# (protection flag "recents"), as a normal/runtime permission, or not at all.
EL_PRIVAPP_PERMS="android.permission.PACKAGE_USAGE_STATS android.permission.BROADCAST_CLOSE_SYSTEM_DIALOGS android.permission.CONTROL_REMOTE_APP_TRANSITION_ANIMATIONS android.permission.START_TASKS_FROM_RECENTS android.permission.WRITE_SECURE_SETTINGS android.permission.STATUS_BAR android.permission.STOP_APP_SWITCHES android.permission.ALLOW_SLIPPERY_TOUCHES android.permission.ACCESS_HIDDEN_PROFILES_FULL android.permission.ACCESS_CONTEXTUAL_SEARCH"
# The manifest's <uses-library required="false"> tags, in order: tree/Android.bp's
# optional_uses_libs must list the same, or the build's uses-library check stops.
EL_OPTIONAL_USES_LIBS="androidx.window.extensions androidx.window.sidecar"
# The components the ROM points at: Home, the Recents activity SystemUI's
# config_recentsComponentName names, the quickstep service SystemUI binds, and the gesture
# tutorial's last page that the setup wizard opens when it ends.
EL_HOME_ACTIVITY=app.lawnchair.LawnchairLauncher
EL_RECENTS_ACTIVITY=com.android.quickstep.RecentsActivity
EL_QUICKSTEP_SERVICE=com.android.quickstep.TouchInteractionService
EL_ALL_SET_ACTION=com.android.quickstep.action.GESTURE_ONBOARDING_ALL_SET
