# Expressive Launcher for ExpressiveOS: the exact release APK that ships as every phone's
# Home and Recents app, and what every script checks it against. Sourced by
# fetch-launcher.sh, apply-launcher.sh and tools/launcher-check.sh: plain NAME=value lines,
# nothing else.
#
# To move to a new release, change every line of the block together, from the release page
# and the update feed (https://raw.githubusercontent.com/denson9874/ExpressiveLauncher/updates/
# qa-v2/latest.json for QA, .../updates/release/latest.json for Stable), then run
# fetch-launcher.sh: it refuses anything that doesn't match. A new privileged permission
# (EL_PERMS) must be added to tree/privapp-permissions-dev.launcher.expressive.l3.xml on
# purpose, or a clean flash won't boot under ro.control_privapp_permissions=enforce (README.md,
# "Pins").

# --- Expressive Launcher (denson9874/ExpressiveLauncher), the unmodified release APK ------
# Daryl, 2026-10-30: the latest QA build, which is well ahead of Stable. The full QA build,
# not "Core": Core leaves out the notification listener (dots) and accessibility service.
# A placeholder until a release built for Android 17 exists: 5.0.4's gesture code is built
# against Android 16's WindowManager Shell and fails as the Recents app (README.md, "Status").
EL_CHANNEL=qa
EL_VERSION=5.0.4
EL_VERSION_CODE=66
EL_TAG=qa-v5.0.4-66
EL_URL=https://github.com/denson9874/ExpressiveLauncher/releases/download/qa-v5.0.4-66/ExpressiveLauncherL3-5.0.4-Android17-QPR2-Beta5-Jenkins-QA-release-signed.apk
EL_FILE=ExpressiveLauncherL3-5.0.4-Android17-QPR2-Beta5-Jenkins-QA-release-signed.apk
EL_SHA256=3f71ec98dbdca94c4e339405031c830c36baee53d9fcc311c5d2e6c24a0df4f0
EL_SIZE=24389807
# SHA-256 of the APK's signing certificate (v1, v2 and v3 all use it): Expressive's release
# certificate, the same for Stable and QA, so GitHub and in-app updates install over the
# built-in copy.
EL_CERT_SHA256=c14160306d5c059b3d119f15fb74e08c57cc272316e80b36e192c71dc9e4d0d2
EL_PACKAGE=dev.launcher.expressive.l3
EL_SRC=https://github.com/denson9874/ExpressiveLauncher
# The source revision the release names ("Source revision" on the release page)
EL_COMMIT=896a25f03ea95d8ee561b21aeb35e04079a02c8f
# Apache-2.0 (AOSP Launcher3 and Lawnchair), the LICENSE.txt at that revision
EL_LICENSE_URL=https://raw.githubusercontent.com/denson9874/ExpressiveLauncher/896a25f03ea95d8ee561b21aeb35e04079a02c8f/LICENSE.txt
EL_LICENSE_FILE=ExpressiveLauncher-896a25f-LICENSE.txt
EL_LICENSE_SHA256=4bb3ad323fe4c27f06a47b39c0ae6ad35315f15c40e46c81a5211f7f519286ab
# The licences of what it carries beside that (docs/THIRD_PARTY_NOTICES.md at that revision),
# staged next to LICENSE: the calculator's MIT licence, from the source at that revision, and
# Google Sans Flex's OFL-1.1 from the font's own repository at the revision that file names
# (the repository's docs/licenses/GoogleSansFlex-OFL.txt is empty at 896a25f).
EL_NOTICE_MIT_URL=https://raw.githubusercontent.com/denson9874/ExpressiveLauncher/896a25f03ea95d8ee561b21aeb35e04079a02c8f/lawnchair/src/app/lawnchair/search/algorithms/data/calculator/LICENSE
EL_NOTICE_MIT_FILE=ExpressiveLauncher-896a25f-calculator-LICENSE.txt
EL_NOTICE_MIT_SHA256=6f1b3f6fecde974467f78fec9fdad2614c1652ec2bda13206b83c2f9f083a0c9
EL_NOTICE_OFL_URL=https://raw.githubusercontent.com/googlefonts/googlesans-flex/6cffd50d9ff4ead23eda9dc7864eb9aed9fe304c/OFL.txt
EL_NOTICE_OFL_FILE=GoogleSansFlex-6cffd50-OFL.txt
EL_NOTICE_OFL_SHA256=831b6e041705873c3e6efb18c4c96202bc41c8be42a456d3d26c47abf14816d0
# Every <uses-permission> in the APK's manifest, in manifest order. fetch-launcher.sh refuses
# an APK that asks for anything else.
EL_PERMS="dev.launcher.expressive.feed.permission.CONNECT android.permission.REQUEST_INSTALL_PACKAGES android.permission.POST_NOTIFICATIONS android.permission.RECEIVE_BOOT_COMPLETED android.permission.ACCESS_NETWORK_STATE android.permission.MANAGE_EXTERNAL_STORAGE android.permission.INTERNET android.permission.PACKAGE_USAGE_STATS android.permission.FOREGROUND_SERVICE android.permission.FOREGROUND_SERVICE_DATA_SYNC com.google.android.apps.nexuslauncher.permission.QSB com.kieronquinn.app.smartspacer.permission.ACCESS_SMARTSPACER android.permission.READ_CONTACTS android.permission.READ_MEDIA_AUDIO android.permission.STATUS_BAR_SERVICE android.permission.FLASHLIGHT android.permission.BROADCAST_CLOSE_SYSTEM_DIALOGS android.permission.CONTROL_REMOTE_APP_TRANSITION_ANIMATIONS android.permission.VIBRATE android.permission.QUERY_ALL_PACKAGES android.permission.START_TASKS_FROM_RECENTS android.permission.REMOVE_TASKS android.permission.WRITE_SECURE_SETTINGS android.permission.MANAGE_ACTIVITY_TASKS android.permission.INTERNAL_SYSTEM_WINDOW android.permission.STATUS_BAR android.permission.STOP_APP_SWITCHES android.permission.SET_ORIENTATION android.permission.READ_FRAME_BUFFER android.permission.MANAGE_ACCESSIBILITY android.permission.MONITOR_INPUT android.permission.ALLOW_SLIPPERY_TOUCHES android.permission.ACCESS_SHORTCUTS android.permission.SYSTEM_APPLICATION_OVERLAY android.permission.ACCESS_HIDDEN_PROFILES_FULL android.permission.ACCESS_HIDDEN_PROFILES android.permission.MANAGE_KEY_GESTURES android.permission.CALL_PHONE android.permission.SET_WALLPAPER android.permission.SET_WALLPAPER_HINTS android.permission.REQUEST_DELETE_PACKAGES android.permission.EXPAND_STATUS_BAR dev.launcher.expressive.l3.permission.READ_SETTINGS dev.launcher.expressive.l3.permission.WRITE_SETTINGS dev.launcher.expressive.l3.permission.GRID_CONTROL dev.launcher.expressive.l3.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
# The ones whose protectionLevel (frameworks/base core/res/AndroidManifest.xml) includes
# "privileged": each needs a line in the privapp XML, or a privileged system app fails the
# boot under ro.control_privapp_permissions=enforce (the build sets "log" today, which only
# logs it, but the list is kept exact either way). The others it gets as the Recents app
# (protection flag "recents"), as a normal/runtime permission, or not at all.
EL_PRIVAPP_PERMS="android.permission.PACKAGE_USAGE_STATS android.permission.BROADCAST_CLOSE_SYSTEM_DIALOGS android.permission.CONTROL_REMOTE_APP_TRANSITION_ANIMATIONS android.permission.START_TASKS_FROM_RECENTS android.permission.WRITE_SECURE_SETTINGS android.permission.STATUS_BAR android.permission.STOP_APP_SWITCHES android.permission.ALLOW_SLIPPERY_TOUCHES android.permission.ACCESS_HIDDEN_PROFILES_FULL"
# The manifest's <uses-library required="false"> tags, in order: tree/Android.bp's
# optional_uses_libs must list the same, or the build's uses-library check stops.
EL_OPTIONAL_USES_LIBS="androidx.window.extensions androidx.window.sidecar"
# The components the ROM points at: Home, the Recents activity SystemUI's
# config_recentsComponentName names, the quickstep service SystemUI binds, and the gesture
# tutorial's last page that the setup wizard opens when it ends.
EL_HOME_ACTIVITY=app.lawnchair.LawnchairLauncher
EL_RECENTS_ACTIVITY=com.android.quickstep.RecentsActivity
EL_QUICKSTEP_SERVICE=com.android.quickstep.TouchInteractionService
EL_ALL_SET_ACTION=com.android.quickstep.action.GESTURE_ONBOARDING_ALL_SET
