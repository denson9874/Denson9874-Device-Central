# ExpressiveOS for cheetah (Pixel 7 Pro): the names and pins the kit's scripts read.
# Sourced by lib.sh: plain NAME=value lines, nothing else.
#
# ExpressiveOS is its own ROM (Daryl, 2026-10-25). Every Evolution reference becomes
# Expressive (Daryl, 2026-11-01), only copyright, licence and credit lines stay. Since 1.1
# the build goal is m bacon and the key folder is vendor/expressiveos-priv/keys; the kit still
# takes the old ones (m evolution, vendor/evolution-priv) through 1.1. ro.evolution.* stays
# until a later phase.

# Identity (Daryl, 2026-10-26; build type Official since 2026-11-02: ExpressiveOS is its
# own ROM, so its builds are its official ones). patches/vendor_lineage/0001 bakes the version in as
# EXPRESSIVE_VERSION; change both together. No '-' in it: createjson.py takes the
# version from the zip name's fifth '-' field.
EOS_VERSION=1.1
EOS_BUILD_TYPE=Official
EOS_LUNCH=lineage_cheetah-cp2a-user

# The tree (setup.sh): ExpressiveOS's own manifest, with full git history (Daryl, 2026-10-28:
# ExpressiveOS on its own sources). Every project in it is at a commit, never a branch head:
# ExpressiveOS's own repos (the kit's changes are commits on their expressiveos branch) and
# LineageOS's and AOSP's. Newer sources come only with a new commit of this manifest
EOS_MANIFEST_URL=https://github.com/ExpressiveOS/manifest
EOS_MANIFEST_BRANCH=expressiveos
# Who the monthly update's commits are by (sources/update.py: the forks' merges, the manifest's
# commit): the identity of the kit's commits on ExpressiveOS's forks
EOS_UPDATE_IDENT="Daryl Denson <9751141+denson9874@users.noreply.github.com>"

# The kernel source (tools/eos-make.sh syncs out-kernel/google/gs-6.1 to
# pins/kernel.xml): LineageOS's gs-6.1 kernel manifest, the one build_kernel would follow
EOS_KERNEL_MANIFEST_URL=https://github.com/LineageOS/android_kernel_google_gs-6.1_manifest
EOS_KERNEL_MANIFEST_BRANCH=lineage-24.0

# Update feed (patches/device_google_pantah/0002 points the Updater here). Never rename
# the repo or its branch: the Updater doesn't follow redirects.
EOS_FEED_REPO=denson9874/expressiveos_ota
EOS_FEED_BRANCH=main

# Releases (never Evolution X's ~/releases/cheetah, SourceForge cheetah/17 or R2 cheetah/)
EOS_RELEASES=releases/expressiveos-cheetah
EOS_SF_DIR=/home/frs/project/denson9874-s-user-builds/expressiveos/cheetah
EOS_R2_PREFIX=expressiveos/cheetah/
# Each release's target-files, the source of every incremental OTA from it (Daryl,
# 2026-10-27): eos-pack.sh --upload sends them to <EOS_R2_REMOTE>/<EOS_R2_PREFIX>target-files/
# with ~/bin/rclone (its r2: remote, tools/ota_mirror/README.md). Empty: to
# <EOS_SF_DIR>/target-files on SourceForge instead. Only an incremental OTA script reads them.
EOS_R2_REMOTE=r2:denson9874-ota
# What the Updater downloads OTA packages from (tools/ota_mirror/: the ota-mirror Worker,
# serving that bucket): tools/eos-ota.sh puts them in R2's <EOS_R2_PREFIX>ota/ and the feed
# names <EOS_OTA_MIRROR>/<EOS_R2_PREFIX>ota/<package>
EOS_OTA_MIRROR=https://ota-mirror.daryldenson-apps.workers.dev
# The backup of the last two releases of each phone (Daryl, 2026-11-03): R2 keeps the current
# one only (tools/eos-storage.sh prune), Google Drive the last two (eos-storage.sh drive
# <phone>, into <EOS_DRIVE_BACKUP>/<phone>/<release>/), through ~/bin/rclone's gdrive: remote
EOS_DRIVE_BACKUP='gdrive:ExpressiveOS releases'

# Attestation keybox mirror (tools/eos-keybox.py): served by tools/ota_mirror/ from R2,
# fetched by services.jar's AxSpoofManager and Expressive Studio's TrickyStore settings.
# Never commit a keybox.xml to git: public repos are scraped onto Google's CRL.
EOS_KEYBOX_R2_KEY=expressiveos/keybox.xml
EOS_KEYBOX_URL=https://ota-mirror.daryldenson-apps.workers.dev/expressiveos/keybox.xml

# Evolution X's public signing keys, which an ExpressiveOS build must never carry:
# vbmeta's "Public key (sha1)" (avbtool info_image) and the OTA certificate's SHA-256
# fingerprint (openssl x509 -fingerprint -sha256), from Evolution X cheetah builds.
EVO_AVB_PUBKEY_SHA1=95fb46a2c29d2db760a8a1dbd4b5ad536dd218d4
EVO_OTA_CERT_SHA256=C2:7F:6E:61:90:7C:D0:53:A6:49:A1:0D:39:B7:1B:28:61:50:4B:60:7E:07:07:F6:8C:85:04:9D:74:03:8F:26

# ExpressiveOS's own (README.md, "Keys"): made once on the build server 2026-10-26 12:10 UTC,
# never again. eos-keys-check.sh fails any tree whose keys differ; restore
# vendor/expressiveos-priv/keys from the backup, never make new ones.
EOS_AVB_PUBKEY_SHA1=C2ACE85A1663240A6DA54284D397E7B1D7F916F6
EOS_OTA_CERT_SHA256=056EF5B1656ECA9BE001C0364336A46A32AA93095BDE42C99099433CDA45D820
