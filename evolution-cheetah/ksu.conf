# KernelSU Next for cheetah (Pixel 7 Pro): the release fetch-ksu.sh downloads.
# Copy each SHA-256 from the release page,
# https://github.com/KernelSU-Next/KernelSU-Next/releases/tag/<version>,
# or, when the page lists none, from fetch-ksu.sh's first run after checking the
# file came from that release. fetch-ksu.sh refuses anything that doesn't match.
version=v3.4.2
# Google's GKI that cheetah's boot.img ships (cheetah-ksu.sh checks the build agrees)
kmi=android14-6.1
# Host ksud (x86_64 Linux): patches init_boot on the build server, with
# kernelsu.ko, the susfs guard module and ksuinit for every KMI built in.
ksud_url=https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.2/ksud-x86_64-unknown-linux-musl
# Downloaded 2026-10-25 from the URL above (ksud --version: 3.4.2). TODO before release: compare with the
# release page; fetch-ksu.sh trusts this value
ksud_sha256=4d22f89416e7eef8f684f1ed03d2bea19da33c7d41266546e94fd7d1f6cbeca9
# Manager APK, preinstalled by device/google/pantah 0010. The file name carries
# a build number (e.g. KernelSU_Next_v3.4.2_<code>-release.apk): copy the release's
# plain APK link, not the "spoofed" one.
manager_url=
manager_sha256=
